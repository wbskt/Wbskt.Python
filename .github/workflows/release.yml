name: Release

# On a tag v<version>, checks the SDK again, then builds it and publishes it to PyPI as `wbskt`
# through trusted publishing: the PyPI project must trust this repository, this workflow and the
# `pypi` environment. No token is stored.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Fails in seconds, before the suites run, for a tag that names the wrong version or a commit
  # that isn't on master. A version can't be replaced once it is on PyPI.
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag matches the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/wbskt/version.py)"
          if [[ "v$version" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version $version"
            exit 1
          fi
      - name: Check the tagged commit is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on master"
            exit 1
          fi

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install build twine && python -m build && twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
