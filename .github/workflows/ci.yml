name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
  # Weekly, so a websockets release that breaks the client shows here before a user meets it.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported Python with the oldest supported websockets, the newest of both, and
        # each release between on the newest websockets, so every Python the classifiers claim is run.
        include:
          - python: '3.10'
            websockets: 'websockets==13.0'
          - python: '3.11'
            websockets: 'websockets'
          - python: '3.12'
            websockets: 'websockets'
          - python: '3.13'
            websockets: 'websockets'
          - python: '3.14'
            websockets: 'websockets'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]' '${{ matrix.websockets }}'
      - run: python -m pytest -q

  # The newest websockets, past the cap in pyproject.toml, so the next major is tried before the cap
  # is raised. Only on the weekly run: a failure here says to fix the client, not that a PR broke it.
  newest-websockets:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - run: pip install -e '.[test]' && pip install --upgrade websockets
      - run: python -c "import websockets; print('websockets', websockets.__version__)"
      - run: python -m pytest -q

  conformance:
    # The client protocol checklist (Tests/Conformance in wbskt/Wbskt), run against this SDK
    # through conformance/harness.py.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: wbskt/Wbskt
          path: wbskt
          sparse-checkout: Tests/Conformance
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Run the suite
        working-directory: wbskt/Tests/Conformance
        run: |
          pip install -r requirements.txt
          pip install -e "$GITHUB_WORKSPACE"
          WBSKT_HARNESS="python $GITHUB_WORKSPACE/conformance/harness.py" python -m pytest -v
