# Weekly update proposals: the pinned workflow actions (the SHA moves with the version in its
# comment) and the package's own dependency floors. Minor and patch bumps come grouped; majors come
# on their own, since those are the ones to read.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python:
        update-types: [minor, patch]
