[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wbskt"
dynamic = ["version"]
description = "Connect a Raspberry Pi, script or service to Wbskt: register with a policy PIN, hold a WebSocket open, send readings and receive commands."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wbskt" }]
keywords = ["wbskt", "iot", "websocket", "raspberry-pi", "clients"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
  "Operating System :: OS Independent",
  "Topic :: Home Automation",
  "Framework :: AsyncIO",
]
dependencies = ["websockets>=13"]

[project.urls]
Homepage = "https://wbskt.com"
Source = "https://github.com/wbskt/Wbskt.Python"
Issues = "https://github.com/wbskt/Wbskt.Python/issues"
Protocol = "https://github.com/wbskt/Wbskt/blob/master/Docs/Client.Protocol.md"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.version]
path = "src/wbskt/version.py"

[tool.hatch.build.targets.sdist]
include = ["src/wbskt", "tests", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/wbskt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
